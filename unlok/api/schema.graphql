  """The most scopes an app may ask for. Null: the organization's."""
  scopes: [String!]

  """The most requirements an app may ask for. Null: any."""
  requirements: [RequirementPin!]
}

"""Why a mandate stopped working."""
enum MandateRevocation {
  REVOKED
  PARENT_REVOKED
  ISSUER_REVOKED
  REMOVED_FROM_CONFIG
  SUPERSEDED
  ORGANIZATION_REVOKED
}

input ManifestInput {
