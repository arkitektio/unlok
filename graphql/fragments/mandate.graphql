fragment MandatePin on MandatePin {
  identifier
  version
  deviceId
  scopes
  requirements {
    key
    service
  }
}

fragment Mandate on Mandate {
  id
  claimant
  origin
  label
  keyPrefix
  agentIdentifier
  subject {
    ...MandatePin
  }
  attestation
  maxClients
  allowMesh
  createdAt
  expiresAt
  revokedAt
  revocationReason
  lastUsedAt
  isLive
  grantor {
    id
  }
  hub {
    id
  }
  parent {
    id
  }
  clients {
    id
    clientId
  }
}

fragment IssuedMandateKey on IssuedMandateKey {
  key
  mandate {
    ...Mandate
  }
}
