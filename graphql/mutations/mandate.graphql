mutation CreateMandate($input: CreateMandateInput!) {
  createMandate(input: $input) {
    ...Mandate
  }
}

mutation IssueMandateKey($input: IssueMandateKeyInput!) {
  issueMandateKey(input: $input) {
    ...IssuedMandateKey
  }
}

mutation IssueChildMandateKey($mandate: ID!, $deviceId: String!, $expiresInDays: Int, $label: String) {
  issueChildMandateKey(input: { mandate: $mandate, deviceId: $deviceId, expiresInDays: $expiresInDays, label: $label }) {
    ...IssuedMandateKey
  }
}

mutation RevokeMandate($id: ID!) {
  revokeMandate(input: { id: $id }) {
    ...Mandate
  }
}
