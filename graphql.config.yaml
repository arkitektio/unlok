projects:
  unlok:
    schema: https://go.arkitekt.live/lok/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: unlok/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          enabled: true
          populate_by_name: true
          alias_mode: split
          use_enum_values: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of UnlokApi, which the client mixes in.
            # Each method hands its operation to execute/aexecute/subscribe/
            # asubscribe of self, which the Unlok client implements over its
            # rath; no call looks a client up.
            client_class: UnlokApi
            # The client's own attributes: pydantic lets a field hide a method.
            reserved_from:
              - unlok.unlok.Unlok
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
        processors:
          - type: turms.processors.black.BlackProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          ID: rath.scalars.ID
          Version: str
          AppIdentifier: str
          UnsafeChild: typing.Any
          ServiceIdentifier: str
          Identifier: str
          JSON: typing.Any
